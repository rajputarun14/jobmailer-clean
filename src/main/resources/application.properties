spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
# IMPORTANT: For Gmail, create an App Password and paste it below (do NOT commit secrets).
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
## Use a file-based H2 DB so sent-email records persist across restarts
## PostgreSQL configuration (for local dev you can use docker-compose)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/jobmailer}
spring.datasource.username=${DATABASE_USERNAME:jobmailer}
spring.datasource.password=${DATABASE_PASSWORD:jobmailer}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret=${JWT_SECRET:${APP_PASSWORD:change-me-in-production}}
security.credentials.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:${JWT_SECRET:${APP_PASSWORD:change-me-in-production}}}
security.jwt.ttl-seconds=3600
security.rate-limit.max-requests=5
security.rate-limit.window-seconds=60
ai.provider=${AI_PROVIDER:gemini}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
# Optional: keep H2 console config commented when using Postgres
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
