spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
# IMPORTANT: For Gmail, create an App Password and paste it below (do NOT commit secrets).
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Enable JavaMail debug to see SMTP conversation (temporary)
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
## Use a file-based H2 DB so sent-email records persist across restarts
## PostgreSQL configuration (for local dev you can use docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/jobmailer
spring.datasource.username=jobmailer
spring.datasource.password=jobmailer
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Optional: keep H2 console config commented when using Postgres
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
