<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sent Emails Dashboard</title>
  <style>
    body{font-family: Arial, sans-serif;margin:20px}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #ddd;padding:8px}
    th{background:#f4f4f4}
    button{padding:6px 10px}
  </style>
</head>
<body>
  <h1>Sent Emails</h1>
  <p><a href="/index.html"><button>Home</button></a></p>
  <div id="status"></div>
  <table>
    <thead>
      <tr><th>Recipient</th><th>Subject</th><th>Sent At</th><th>Opened</th><th>Opened At</th><th>Followups</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    async function load(){
      const res = await fetch('/emails');
      const data = await res.json();
      const rows = document.getElementById('rows'); rows.innerHTML='';
      data.forEach(e => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${e.recipient}</td>
          <td>${e.subject}</td>
          <td>${new Date(e.sentAt).toLocaleString()}</td>
          <td>${e.opened ? 'Yes' : 'No'}</td>
          <td>${e.openedAt ? new Date(e.openedAt).toLocaleString() : ''}</td>
          <td>${e.followupsSent}</td>
          <td><button data-id="${e.id}">Send follow-up</button></td>`;
        rows.appendChild(tr);
      });
      document.querySelectorAll('button[data-id]').forEach(b => b.onclick = followup);
    }

    async function followup(evt){
      const id = evt.currentTarget.getAttribute('data-id');
      const res = await fetch('/emails/'+id+'/followup', {method:'POST'});
      const txt = await res.text();
      const status = document.getElementById('status');
      status.textContent = txt;
      setTimeout(()=>status.textContent='',3000);
      load();
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
