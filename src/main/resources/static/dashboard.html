<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sent Emails Dashboard</title>
  <style>
    body{font-family: Arial, sans-serif;margin:20px}
    table{border-collapse:collapse;width:100%}
    th,td{border:1px solid #ddd;padding:8px}
    th{background:#f4f4f4}
    button{padding:6px 10px}
  </style>
</head>
<body>
  <h1>Sent Emails</h1>
  <p id="sessionUser" style="color:#555;font-size:14px;margin:4px 0 12px"></p>
  <p><a href="/index.html"><button>Home</button></a></p>
  <div id="status"></div>
  <table>
    <thead>
      <tr><th>From</th><th>To</th><th>Subject</th><th>Sent At</th><th>Opened</th><th>Opened At</th><th>Followups</th><th>Actions</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    async function load(){
      const res = await fetch('/emails');
      const data = await res.json();
      const rows = document.getElementById('rows'); rows.innerHTML='';
      data.forEach(e => {
        const tr = document.createElement('tr');
        appendCell(tr, e.owner || '');
        appendCell(tr, e.recipient || '');
        appendCell(tr, e.subject || '');
        appendCell(tr, e.sentAt ? new Date(e.sentAt).toLocaleString() : '');
        appendCell(tr, e.opened ? 'Yes' : 'No');
        appendCell(tr, e.openedAt ? new Date(e.openedAt).toLocaleString() : '');
        appendCell(tr, e.followupsSent == null ? '0' : String(e.followupsSent));
        const actionCell = document.createElement('td');
        const button = document.createElement('button');
        button.dataset.id = e.id;
        button.textContent = 'Send follow-up';
        actionCell.appendChild(button);
        tr.appendChild(actionCell);
        rows.appendChild(tr);
      });
      document.querySelectorAll('button[data-id]').forEach(b => b.onclick = followup);
    }

    function appendCell(row, text){
      const td = document.createElement('td');
      td.textContent = text;
      row.appendChild(td);
    }

    async function followup(evt){
      const id = evt.currentTarget.getAttribute('data-id');
      const res = await fetch('/emails/'+id+'/followup', {method:'POST'});
      const txt = await res.text();
      const status = document.getElementById('status');
      status.textContent = txt;
      setTimeout(()=>status.textContent='',3000);
      load();
    }

    async function showSessionUser(){
      try{
        const s = await fetch('/api/session');
        const j = await s.json();
        if(s.ok && j.username){
          document.getElementById('sessionUser').textContent = 'Signed in as ' + j.username;
        }
      }catch(e){}
    }
    showSessionUser();
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
