<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register - Job Mailer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,Arial;background:#0b1220;color:#e6eef8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .box{background:rgba(255,255,255,0.04);padding:28px;border-radius:8px;width:min(440px,92vw);border:1px solid rgba(255,255,255,0.08)}
    label{display:block;margin-top:14px;font-size:14px;color:#d7e2f0}
    input{box-sizing:border-box;width:100%;padding:10px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:inherit;margin-top:8px}
    button{width:100%;margin-top:12px;padding:10px;border-radius:8px;border:none;background:#7c3aed;color:white;font-weight:600}
    .note{color:#94a3b8;font-size:13px;margin-top:8px}
    a { color:#a78bfa }
  </style>
</head>
<body>
  <form class="box" method="post" action="/register">
    <h2 style="margin:0 0 8px 0">Create account</h2>
    <div class="note">Use your Gmail address as your account email. Your Gmail app password is encrypted and used only for sending emails.</div>
    <label>Email address</label>
    <input name="email" type="email" autocomplete="username" placeholder="you@gmail.com" required />
    <label>Login password</label>
    <input name="password" type="password" autocomplete="new-password" minlength="8" required />
    <label>Gmail app password</label>
    <input name="gmailAppPassword" type="password" autocomplete="off" placeholder="16-character app password" required />
    <div class="note">Create this in Google Account → Security → 2-Step Verification → App passwords.</div>
    <button type="submit">Create account</button>
    <div class="note">After registration you can sign in at <a href="/login.html">Sign in</a>.</div>
  </form>
</body>
</html>
