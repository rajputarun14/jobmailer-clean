<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login - Job Mailer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,#071029,#0b1220);color:#e6eef8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .box{background:rgba(255,255,255,0.03);padding:28px;border-radius:12px;width:360px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;margin-top:8px}
    button{width:100%;margin-top:12px;padding:10px;border-radius:8px;border:none;background:#7c3aed;color:white;font-weight:600}
    .note{color:#94a3b8;font-size:13px;margin-top:8px}
  </style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h2 style="margin:0 0 8px 0">Sign in</h2>
    <label>Username</label>
    <input name="username" autocomplete="username" required />
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
    <div class="note">Use your app credentials. For local dev set <code>APP_USER</code> and <code>APP_PASSWORD</code> env vars.</div>
    <div class="note" style="margin-top:6px"><a href="/register.html" style="color:#a78bfa">Create an account</a></div>
  </form>
</body>
</html>
